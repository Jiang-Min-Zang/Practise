<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Order summary card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <main class="card">
        <div class="Picture">
          <img src="./images/illustration-hero.svg" alt="" />
        </div>
        <div class="Content">
          <div class="title">
            <h3>Order Summary</h3>
          </div>
          <p>
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </p>
        </div>
        <div class="PricingPlan">
          <div class="left">
            <div class="left-img">
              <img src="./images/icon-music.svg" alt="音樂符號" />
            </div>
            <div class="left-content">
              <span>Annual Plan </span>
              <span>$59.99/year</span>
            </div>
          </div>
          <div class="right">
            <span>Change</span>
          </div>
        </div>
        <div class="PaymentButton">
          <span>Proceed to Payment</span>
        </div>
        <div class="Close">
          <span>Cancel Order</span>
        </div>
      </main>
    </div>
    <!-- Order Summary You can now listen to millions of songs, audiobooks, and
    podcasts on any device anywhere you like! Annual Plan $59.99/year Change
    Proceed to Payment Cancel Order -->
  </body>
</html>
