<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="/style.css" />
    <title>Ping coming soon page</title>
  </head>
  <body>
    <main class="container">
      <div class="web-page">
        <div class="summary">
          <div class="summary-title">
            <p>PING.</p>
          </div>
          <div class="summary-middle">
            <p>We are launching soon!</p>
          </div>
          <div class="summary-text">
            <p>Subscribe and get notified</p>
          </div>
        </div>
        <div class="input-box">
          <input
            class="input-style"
            type="text"
            placeholder="example@email.com"
          />
          <div class="input-error-text">
            <p>Please provide a valid email address</p>
          </div>
          <div class="input-box-span">
            <span onclick="Send()">Notify Me</span>
          </div>
        </div>
        <div class="data-img">
          <img src="/images/illustration-dashboard.png" alt="" />
        </div>
        <div class="link-account">
          <div class="link-account-img">
            <a href="https://www.facebook.com/">
              <img src="/images/icons8-facebook-50.png" alt="" />
            </a>
            <a href="https://x.com/">
              <img src="/images/icons8-twitter-circled-50.png" alt="" />
            </a>
            <a href="https://www.instagram.com/">
              <img src="/images/icons8-instagram-logo-50.png" alt="" />
            </a>
          </div>
          <p>&copy; Copyright Ping. All rights reserved.</p>
        </div>
      </div>
    </main>
    <!-- We are launching soon!

  Subscribe and get notified

  Notify Me

  &copy; Copyright Ping. All rights reserved. -->
    <script src="./app.js"></script>
  </body>
</html>
