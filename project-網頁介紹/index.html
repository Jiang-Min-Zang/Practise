<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="/style.css" />
    <title>Huddle landing page with single introductory section</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <div class="container">
      <main class="page-background">
        <div class="page-title">
          <img src="./images/logo.svg" alt="logo" />
        </div>
        <div class="page-middle-web">
          <div class="page-img">
            <img src="./images/illustration-mockups.svg" alt="" />
          </div>
          <div class="main-centent">
            <div class="centent-title">
              <p>Build The Community Your Fans Will Love</p>
            </div>
            <div class="centent-text">
              <p>
                Huddle re-imagines the way we build communities. You have a
                voice, but so does your audience. Create connections with your
                users as you engage in genuine discussion.
              </p>
            </div>
            <div class="centent-span">
              <span> Register </span>
            </div>
          </div>
        </div>

        <footer class="footer">
          <div class="footer-img">
            <img src="./images/icons8-facebook-50.png" alt="fb" />
          </div>
          <div class="footer-img">
            <img src="./images/icons8-twitter-circled-50.png" alt="twitter" />
          </div>
          <div class="footer-img">
            <img src="./images/icons8-instagram-logo-50.png" alt="ig" />
          </div>
        </footer>
      </main>
    </div>
    <!-- Build The Community Your Fans Will Love

  Huddle re-imagines the way we build communities. You have a voice, but so does your audience. 
  Create connections with your users as you engage in genuine discussion. 

  Register -->
  </body>
</html>
