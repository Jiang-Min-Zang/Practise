<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>重新練習</title>
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <main class="card">
      <div class="left">
        <div class="header-left">
          <p>Your Result</p>
        </div>
        <div class="average-left">
          <div class="average-left2"><span>76</span></div>
          <span>of 100</span>
        </div>
        <div class="text">
          <div class="text2">
            <p>Great</p>
          </div>
          <p>
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
      </div>
      <div class="right">
        <div class="header-right">
          <p>Summary</p>
        </div>
        <div class="FractionBox">
          <div class="Fraction1">
            <img src="./assets/images/icon-reaction.svg" alt="" />
            <p>1</p>
          </div>
          <div class="Fraction2">
            <img src="./assets/images/icon-memory.svg" alt="" />
            <p>2</p>
          </div>
          <div class="Fraction3">
            <img src="./assets/images/icon-verbal.svg" alt="" />
            <p>3</p>
          </div>
          <div class="Fraction4">
            <img src="./assets/images/icon-visual.svg" alt="" />
            <p>4</p>
          </div>
        </div>
        <div class="result">
          <span>Continue</span>
        </div>
      </div>
    </main>
  </body>
</html>
