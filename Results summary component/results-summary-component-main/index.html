<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Results summary component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="left">
        <p class="left-p2">Your Result</p>
        <div class="score">
          <span class="score-p1">76</span>
          <span class="score-p2">of 100</span>
        </div>
        <h4 class="left-h4">Great</h4>
        <p class="left-p2">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>
      <div class="right">
        <h3 class="h3">Summary</h3>
        <div class="button-box">
          <div class="div-p-box">
            <div class="div-img-box">
              <img src="./assets/images/icon-reaction.svg" alt="閃電" />
              <span>Reaction</span>
            </div>
            <p class="p-box1">80 / 100</p>
          </div>
          <div class="div-p-box2">
            <div class="div-img-box">
              <img src="./assets/images/icon-memory.svg" alt="大腦" />
              <span> Memory </span>
            </div>
            <p class="p-box2">
              <span>92 / 100</span>
            </p>
          </div>
          <div class="div-p-box3">
            <div class="div-img-box">
              <img src="./assets/images/icon-verbal.svg" alt="留言" />
              <span> Verbal</span>
            </div>
            <p class="p-box3">
              <span>61 / 100</span>
            </p>
          </div>

          <div class="div-p-box4">
            <div class="div-img-box">
              <img src="./assets/images/icon-visual.svg" alt="眼睛" />
              <span> Visual</span>
            </div>
            <p class="p-box4">
              <span>73 / 100</span>
            </p>
          </div>

          <div class="div-p-box5">
            <span>Continue</span>
          </div>
        </div>
      </div>
    </main>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div>
  </body>
</html>
